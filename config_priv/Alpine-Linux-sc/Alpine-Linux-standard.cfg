# For Alpine Linux
# https://alpinelinux.org/

iso_pattern="alpine-standard*-x86_64.iso"

for isofile in ($dev,*)$iso_dir/$iso_pattern; do
	if [ -e "$isofile" ]; then
		regexp --set=isoname "$iso_dir/(.*)" "$isofile"

    submenu "$isoname [scandev] ->" "$isofile" "$iso_dir/$isoname" {
		iso_path="$3"
		LOOPBACK "$2"
		addon="/MultiOS-USB/config_priv/Alpine-Linux-sc/alpine323.img"

set timeout=1

menuentry "Alpine Linux lts" {
	linux (loop)/boot/vmlinuz-lts rdinit=/isomount findiso=$iso_path modules=loop,squashfs,sd-mod,usb-storage
	initrd (loop)/boot/initramfs-lts "$addon"
}
}
fi
done
